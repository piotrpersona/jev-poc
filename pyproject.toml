[project]
name = "jev-poc"
version = "0.1.0"
description = "Proof of concept of a TypeSafe/Jev style System One model: typed, calibrated decisions in one parallel pass"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "datasets>=3.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "black>=24.8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
